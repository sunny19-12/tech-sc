<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Sunny Chauhan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900">

  <nav class="bg-black text-white p-4 flex justify-between">
    <a href="index.html" class="font-bold text-xl">Sunny</a>
    <ul class="flex space-x-4 text-sm">
      <li><a href="about.html" class="hover:text-yellow-400">About</a></li>
      <li><a href="portfolio.html" class="hover:text-yellow-400">Portfolio</a></li>
    </ul>
  </nav>

  <section class="py-20 px-6">
    <h2 class="text-4xl font-bold text-center mb-10">Contact Me</h2>
    <form action="#" class="max-w-xl mx-auto space-y-4">
      <input type="text" name="name" placeholder="Your Name" class="w-full px-4 py-2 border rounded">
      <input type="email" name="email" placeholder="Your Email" class="w-full px-4 py-2 border rounded">
      <textarea name="message" placeholder="Your Message" rows="4" class="w-full px-4 py-2 border rounded"></textarea>
      <button class="w-full bg-black text-white py-2 rounded hover:bg-gray-800">Send</button>
    </form>
  </section>
 
</body>
</html>
